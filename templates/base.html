<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}knx-ha2TimeScale{% endblock %}</title>
<style>
:root{--bg:#14161a;--panel:#1c1f26;--line:#2b303a;--fg:#e6e8ec;--dim:#9aa3b2;--ok:#4ea36b;--warn:#c9903a;--bad:#c25a5a;--acc:#5b8dd6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:0 16px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
header b{margin-right:20px;font-weight:600}
header a{color:var(--dim);text-decoration:none;padding:14px 12px;border-bottom:2px solid transparent}
header a:hover{color:var(--fg)}
header a.on{color:var(--fg);border-bottom-color:var(--acc)}
main{padding:20px;max-width:1200px;margin:0 auto}
h2{font-size:16px;margin:24px 0 10px;font-weight:600}
h2:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
tr:hover td{background:#20242c}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.dim{color:var(--dim)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.card .k{color:var(--dim);font-size:12px}
.card .v{font-size:22px;margin-top:4px}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px}
.ok{background:rgba(78,163,107,.18);color:var(--ok)}
.bad{background:rgba(194,90,90,.18);color:var(--bad)}
.warn{background:rgba(201,144,58,.18);color:var(--warn)}
input,select,button{font:inherit;background:#111318;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 9px}
button{cursor:pointer}
button.act{background:var(--acc);border-color:var(--acc);color:#fff}
button.link{background:none;border:none;color:var(--acc);padding:0;text-decoration:underline}
form.inline{display:inline}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.note{color:var(--dim);font-size:13px;margin:8px 0 16px}
</style></head><body>
<header>
  <b>knx-ha2TimeScale</b>
  <a href="/" class="{{ 'on' if nav=='status' }}">Status</a>
  <a href="/knx" class="{{ 'on' if nav=='knx' }}">KNX</a>
  <a href="/ha" class="{{ 'on' if nav=='ha' }}">Home Assistant</a>
  <a href="/patterns" class="{{ 'on' if nav=='patterns' }}">Muster</a>
  <a href="/import" class="{{ 'on' if nav=='import' }}">Import</a>
  <a href="/knx/connection" class="{{ 'on' if nav=='connection' }}">Verbindung</a>
  <a href="/settings" class="{{ 'on' if nav=='settings' }}">Einstellungen</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body></html>
