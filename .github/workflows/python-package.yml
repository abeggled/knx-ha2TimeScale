name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 3.14 failing must not hide a 3.13 result
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Import every module
        # Catches what the tests cannot: a missing import or a syntax error in
        # a module that no test touches. Both have bitten us in production.
        run: |
          python -c "import db, registry, writer, knx_source, ha_source, service, ui, keyring_store"

      - name: Tests
        run: pytest -q
